name: CI

on:
  push:
  pull_request:

jobs:
  lint-types-unit:
    name: Lint, types, unit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check aisvc tests
      - run: ruff format --check aisvc tests
      - run: mypy
      - run: pytest tests/unit -q --cov --cov-report=term-missing

  contract:
    name: Contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest tests/contract -q
