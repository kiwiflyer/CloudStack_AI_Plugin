# License allow-list (SPEC.md section 3).
#
# Every model's `license` must appear here. Enforced at mirror time and at
# deploy time. Root admins edit this file; changes are reviewed in Git.
#
# NOTE: this list mixes two very different kinds of licence, and the
# difference matters because tenants pay for inference on these models.
# See docs/third-party-licenses.md. Presence here is an operator's
# decision to allow a model, not a legal clearance to resell it.
allowed:
  # --- OSI-approved: no use restrictions -----------------------------
  - apache-2.0
  - bsd-3-clause
  - mit

  # --- Open data/content licences ------------------------------------
  - cc-by-4.0
  - cc-by-sa-4.0

  # --- Open weights, restricted use ----------------------------------
  # Redistribution conditions, acceptable-use policies, naming and
  # attribution requirements. Llama additionally requires a separate
  # licence from Meta above a monthly-active-user threshold. Each needs a
  # commercial review before being offered to paying tenants.
  - gemma            # Gemma Terms of Use
  - llama3           # Llama 3 Community License
  - llama3.1         # Llama 3.1 Community License
  - llama3.2         # Llama 3.2 Community License
  - llama3.3         # Llama 3.3 Community License
  - openrail         # RAIL: use-based restrictions
  - qwen             # Tongyi Qianwen License
