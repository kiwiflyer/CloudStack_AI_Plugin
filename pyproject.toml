[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aisvc"
version = "0.1.0"
description = "CloudStack AI Services control plane"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "jinja2>=3.1",
    # Postgres driver. pg8000 (BSD-3-Clause), not psycopg (LGPL-3.0): see
    # docs/third-party-licenses.md. LGPL is Category X for Apache projects.
    "pg8000>=1.31",
    "boto3>=1.35",
    "huggingface-hub>=0.26",
    "kubernetes>=31.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # X.509 parsing for uploaded TLS certificates (SPEC.md section 8).
    # Apache-2.0 OR BSD-3-Clause, both Category A. Needed to check a
    # key matches its certificate before nginx fails on it cryptically.
    "cryptography>=43",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "mypy>=1.11",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
    "schemathesis>=3.38",
]

[project.scripts]
aisvc = "aisvc.cli.main:app"

[tool.setuptools.packages.find]
include = ["aisvc*"]

[tool.setuptools.package-data]
aisvc = ["templates/**/*.j2", "db/migrations/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# GPU tests need a lab zone; `make test-gpu` opts into them explicitly.
addopts = "-m 'not gpu'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "gpu: requires real GPU hardware; runs in the GPU lab only",
]
filterwarnings = ["error"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["aisvc", "tests", "gateway-hooks", "install.py"]
mypy_path = "gateway-hooks"

# Third-party packages that ship no type information. Each is used behind
# a narrow protocol of ours, so the untyped surface is small and contained.
[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "huggingface_hub.*", "kubernetes.*", "litellm.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.coverage.run]
source = ["aisvc"]
